<!DOCTYPE html>
<html Lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --bg: #f0f2f8;
            --bg-accent: #e8ecf4;
            --surface: #ffffff;
            --surface-raised: rgba(255, 255, 255, 0.72);
            --border: rgba(15, 23, 42, 0.08);
            --border-strong: rgba(15, 23, 42, 0.14);
            --text: #0f172a;
            --text-secondary: #334155;
            --muted: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-soft: rgba(99, 102, 241, 0.1);
            --high: #ef4444;
            --medium: #f59e0b;
            --low: #10b981;
            --todo: #6366f1;
            --progress: #0ea5e9;
            --done: #10b981;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow: 0 4px 16px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 20px 48px rgba(15, 23, 42, 0.12), 0 8px 16px rgba(15, 23, 42, 0.06);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 20px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            background:
                radial-gradient(ellipse 80% 60% at 10% -10%, rgba(99, 102, 241, 0.12), transparent),
                radial-gradient(ellipse 60% 50% at 90% 0%, rgba(14, 165, 233, 0.1), transparent),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
            color: var(--text);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        .app-header {
            padding: 32px 32px 20px;
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .app-header h1 {
            margin: 0 0 4px;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text) 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9375rem;
        }

        .app-header-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .button {
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 9px 16px;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition:
                transform 0.2s var(--ease),
                box-shadow 0.2s var(--ease),
                background-color 0.2s var(--ease),
                border-color 0.2s var(--ease);
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .button-primary {
            border-color: transparent;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .button-primary:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.42);
        }

        .button-secondary {
            background: var(--surface);
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
        }

        .button-secondary:hover {
            background: #f8fafc;
            border-color: var(--border-strong);
        }

        main {
            padding: 0 32px 40px;
            max-width: 1280px;
            margin: 0 auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            align-items: start;
        }

        .column {
            background: var(--surface-raised);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            min-height: 240px;
            transition:
                border-color 0.25s var(--ease),
                box-shadow 0.25s var(--ease),
                background-color 0.25s var(--ease);
        }

        .column[data-status="ToDo"] {
            border-top: 3px solid var(--todo);
        }

        .column[data-status="InProgress"] {
            border-top: 3px solid var(--progress);
        }

        .column[data-status="Done"] {
            border-top: 3px solid var(--done);
        }

        .column-title {
            margin: 0 0 14px;
            padding-bottom: 12px;
            font-size: 0.8125rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .column[data-status="ToDo"] .column-title::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--todo);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .column[data-status="InProgress"] .column-title::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--progress);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        .column[data-status="Done"] .column-title::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--done);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .task-card,
        .empty-state,
        .error-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 14px;
        }

        .task-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            cursor: grab;
            transition:
                transform 0.2s var(--ease),
                box-shadow 0.2s var(--ease),
                border-color 0.2s var(--ease);
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: var(--border-strong);
        }

        .task-card .card-actions {
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            transition: opacity 0.2s var(--ease);
        }

        .task-card:hover .card-actions,
        .task-card:focus-within .card-actions {
            opacity: 1;
        }

        .task-card .edit-button {
            padding: 5px 12px;
            font-size: 0.8125rem;
        }

        .task-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
            transform: rotate(2deg) scale(1.02);
            box-shadow: var(--shadow-lg);
        }

        .column.drag-over {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .board-message {
            grid-column: 1 / -1;
            margin-bottom: 4px;
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.875rem;
        }

        .board-message.error {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(254, 242, 242, 0.9);
            color: #dc2626;
        }

        .task-card h3 {
            margin: 0;
            font-size: 0.9375rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.35;
        }

        .task-card p {
            margin: 0;
            color: var(--muted);
            font-size: 0.8125rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .priority-pill {
            display: inline-flex;
            align-items: center;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        .priority-pill.high {
            background: rgba(239, 68, 68, 0.1);
            color: var(--high);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .priority-pill.medium {
            background: rgba(245, 158, 11, 0.1);
            color: var(--medium);
            border: 1px solid rgba(245, 158, 11, 0.22);
        }

        .priority-pill.low {
            background: rgba(16, 185, 129, 0.1);
            color: var(--low);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .empty-state {
            color: var(--muted);
            text-align: center;
            padding: 28px 16px;
            font-size: 0.875rem;
            border-style: dashed;
            background: transparent;
            box-shadow: none;
        }

        .error-card {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(254, 242, 242, 0.9);
            color: #dc2626;
        }

        .loading-skeleton {
            background: linear-gradient(
                90deg,
                rgba(241, 245, 249, 0.8) 25%,
                rgba(226, 232, 240, 0.9) 50%,
                rgba(241, 245, 249, 0.8) 75%
            );
            background-size: 400% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
            border-radius: var(--radius);
            height: 88px;
            margin-bottom: 10px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 20;
            animation: fadeIn 0.2s var(--ease);
        }

        .modal-backdrop.is-open {
            display: flex;
        }

        .modal-dialog {
            width: min(100%, 520px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 24px;
            animation: slideUp 0.25s var(--ease);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.125rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .modal-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
        }

        .modal-close:hover {
            background: var(--bg);
            color: var(--text);
        }

        .modal-close:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-row {
            display: grid;
            gap: 16px;
        }

        .form-row:has(.field-group + .field-group) {
            grid-template-columns: 1fr 1fr;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: 500;
        }

        .field-label {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .field-input,
        .field-select,
        .field-textarea {
            width: 100%;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font: inherit;
            font-size: 0.875rem;
            color: var(--text);
            background: var(--surface);
            transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
        }

        .field-textarea {
            min-height: 96px;
            resize: vertical;
        }

        .field-input:focus,
        .field-select:focus,
        .field-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-error {
            border-color: var(--high);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
        }

        .field-error,
        .form-error {
            font-size: 0.8125rem;
            color: #dc2626;
            min-height: 1em;
        }

        .form-error {
            display: none;
            padding: 10px 14px;
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: var(--radius-sm);
            background: rgba(254, 242, 242, 0.8);
        }

        .form-error.is-visible {
            display: block;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 768px) {
            .board {
                grid-template-columns: 1fr;
            }

            .app-header {
                flex-direction: column;
                padding: 24px 20px 16px;
            }

            .app-header-actions {
                width: 100%;
            }

            .app-header-actions .button-primary {
                width: 100%;
            }

            main {
                padding: 0 20px 32px;
            }

            .form-row:has(.field-group + .field-group) {
                grid-template-columns: 1fr;
            }

            .task-card .card-actions {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div>
            <h1>Task Board</h1>
            <p>Drag tasks between columns to update their status.</p>
        </div>
        <div class="app-header-actions">
            <button id="new-task-button" class="button button-primary" type="button">New Task</button>
        </div>
    </header>


<main>
    <section id="board" class="board" aria-live="polite"></section>
</main>

<div id="task-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <div class="modal-header">
            <h2 id="task-modal-title">New Task</h2>
            <button id="task-modal-close" class="modal-close" type="button" aria-label="Close">×</button>
        </div>
        <form id="task-form" class="modal-form" novalidate>
            <input type="hidden" id="taskId" name="taskId" />
            <div id="form-error" class="form-error" role="alert"></div>
            <div class="form-row">
                <label class="field-group" for="title">
                    <span class="field-label">Title *</span>
                    <input id="title" name="title" class="field-input" type="text" />
                    <span class="field-error" data-field-error="title"></span>
                </label>
            </div>
            <div class="form-row">
                <label class="field-group" for="description">
                    <span class="field-label">Description</span>
                    <textarea id="description" name="description" class="field-textarea"></textarea>
                    <span class="field-error" data-field-error="description"></span>
                </label>
            </div>
            <div class="form-row">
                <label class="field-group" for="status">
                    <span class="field-label">Status</span>
                    <select id="status" name="status" class="field-select">
                        <option value="ToDo">To Do</option>
                        <option value="InProgress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                    <span class="field-error" data-field-error="status"></span>
                </label>
                <label class="field-group" for="priority">
                    <span class="field-label">Priority</span>
                    <select id="priority" name="priority" class="field-select">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                    <span class="field-error" data-field-error="priority"></span>
                </label>
            </div>
            <div class="form-row">
                <label class="field-group" for="assignee">
                    <span class="field-label">Assignee</span>
                    <input id="assignee" name="assignee" class="field-input" type="text" />
                    <span class="field-error" data-field-error="assignee"></span>
                </label>
            </div>
            <div class="modal-footer">
                <button id="cancel-task" class="button button-secondary" type="button">Cancel</button>
                <button class="button button-primary" type="submit">Save Task</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8000";
    const STATUSES = ["ToDo", "InProgress", "Done"];
    const STATUS_LABELS = {
        "ToDo": "To Do",
        "InProgress": "In Progress",
        "Done": "Done"
    };
    const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };
    const FORM_FIELDS = ["title", "description", "status", "priority", "assignee"];

    let tasks = [];
    let boardState = "loading";
    let boardMessage = "";
    let activeDragTaskId = null;
    let modalState = { isOpen: false, mode: "create", taskId: null, originalTask: null };

    function fetchTasks() {
        boardState = "loading";
        boardMessage = "";
        render();

        fetch(`${API_BASE}/tasks`)
            .then((response) => {
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }
                return response.json();
            })
            .then((data) => {
                tasks = Array.isArray(data) ? data : [];
                boardState = "ready";
                render();
            })
            .catch((error) => {
                console.error(error);
                boardState = "error";
                render();
            });
    }

    function compareTasks(a, b) {
        const priorityDiff = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
        if (priorityDiff !== 0) {
            return priorityDiff;
        }
        return a.id - b.id;
    }

    function clearDragHighlights() {
        document.querySelectorAll(".column.drag-over").forEach((column) => {
            column.classList.remove("drag-over");
        });
        document.querySelectorAll(".task-card.dragging").forEach((card) => {
            card.classList.remove("dragging");
        });
    }

    function handleDragStart(event) {
        const card = event.currentTarget;
        const taskId = card.getAttribute("data-task-id");
        activeDragTaskId = taskId;
        card.classList.add("dragging");

        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", taskId || "");
        }
    }

    function handleDragEnd() {
        clearDragHighlights();
        activeDragTaskId = null;
    }

    function handleDragOver(event) {
        event.preventDefault();
        event.currentTarget.classList.add("drag-over");
    }

    function handleDrop(event) {
        event.preventDefault();
        const column = event.currentTarget;
        const targetStatus = column.getAttribute("data-status");
        const taskId = event.dataTransfer?.getData("text/plain") || activeDragTaskId;

        clearDragHighlights();
        column.classList.remove("drag-over");

        if (!taskId) {
            return;
        }

        const task = tasks.find((item) => item.id === taskId);
        if (!task || task.status === targetStatus) {
            activeDragTaskId = null;
            return;
        }

        const previousStatus = task.status;
        const optimisticTask = { ...task, status: targetStatus };
        tasks = tasks.map((item) => (item.id === taskId ? optimisticTask : item));
        boardMessage = "";
        render();

        fetch(`${API_BASE}/tasks/${taskId}`, {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ status: targetStatus })
        })
            .then(async (response) => {
                if (!response.ok) {
                    let errorMessage = `Server returned ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.detail || errorData.message || errorMessage;
                    } catch (error) {
                        console.error(error);
                    }
                    throw new Error(errorMessage);
                }
                return response.json();
            })
            .then((updatedTask) => {
                tasks = tasks.map((item) => (item.id === taskId ? updatedTask : item));
                boardMessage = "";
                render();
            })
            .catch((error) => {
                tasks = tasks.map((item) => (item.id === taskId ? { ...item, status: previousStatus } : item));
                boardMessage = error instanceof Error && error.message
                    ? error.message
                    : "Unable to update task status. Please try again.";
                render();
            });
    }

    function openTaskModal(task = null) {
        const modal = document.getElementById("task-modal");
        const form = document.getElementById("task-form");
        const modalTitle = document.getElementById("task-modal-title");
        const taskIdInput = document.getElementById("taskId");

        if (!modal || !form || !modalTitle || !taskIdInput) {
            return;
        }

        clearTaskErrors();
        form.reset();
        taskIdInput.value = "";

        modalState = { isOpen: true, mode: task ? "edit" : "create", taskId: task?.id || null, originalTask: task || null };

        if (task) {
            modalTitle.textContent = "Edit Task";
            document.getElementById("title").value = task.title || "";
            document.getElementById("description").value = task.description || "";
            document.getElementById("status").value = task.status || "ToDo";
            document.getElementById("priority").value = task.priority || "Medium";
            document.getElementById("assignee").value = task.assignee || "";
            taskIdInput.value = task.id || "";
        } else {
            modalTitle.textContent = "New Task";
            document.getElementById("status").value = "ToDo";
            document.getElementById("priority").value = "Medium";
        }

        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        setTimeout(() => document.getElementById("title").focus(), 0);
    }

    function closeTaskModal() {
        const modal = document.getElementById("task-modal");
        if (modal) {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
        }

        clearTaskErrors();
        const form = document.getElementById("task-form");
        if (form) {
            form.reset();
            document.getElementById("taskId").value = "";
        }

        modalState = { isOpen: false, mode: "create", taskId: null, originalTask: null };
        document.body.style.overflow = "";
    }

    function clearTaskErrors() {
        const formError = document.getElementById("form-error");
        if (formError) {
            formError.textContent = "";
            formError.classList.remove("is-visible");
        }

        FORM_FIELDS.forEach((fieldName) => {
            const input = document.getElementById(fieldName);
            const errorEl = document.querySelector(`[data-field-error="${fieldName}"]`);
            if (input) {
                input.classList.remove("input-error");
            }
            if (errorEl) {
                errorEl.textContent = "";
            }
        });
    }

    function showFieldError(fieldName, message) {
        const input = document.getElementById(fieldName);
        const errorEl = document.querySelector(`[data-field-error="${fieldName}"]`);
        if (input) {
            input.classList.add("input-error");
        }
        if (errorEl) {
            errorEl.textContent = message;
        }
    }

    function showFormError(message) {
        const formError = document.getElementById("form-error");
        if (formError) {
            formError.textContent = message;
            formError.classList.add("is-visible");
        }
    }

    function extractErrorDetails(errorData) {
        if (Array.isArray(errorData?.detail)) {
            const firstDetail = errorData.detail[0];
            const fieldName = typeof firstDetail?.loc?.[1] === "string" ? firstDetail.loc[1] : "";
            const message = firstDetail?.msg || "Unable to save task.";
            return { fieldName, message };
        }

        if (typeof errorData?.detail === "string") {
            return { fieldName: "", message: errorData.detail };
        }

        return { fieldName: "", message: "Unable to save task." };
    }

    async function handleTaskSubmit(event) {
        event.preventDefault();
        clearTaskErrors();

        const titleInput = document.getElementById("title");
        const trimmedTitle = titleInput.value.trim();
        if (!trimmedTitle) {
            showFieldError("title", "Title is required");
            titleInput.focus();
            return;
        }

        const descriptionInput = document.getElementById("description");
        const statusInput = document.getElementById("status");
        const priorityInput = document.getElementById("priority");
        const assigneeInput = document.getElementById("assignee");
        const taskId = document.getElementById("taskId").value;
        const payload = {};

        if (!taskId) {
            payload.title = trimmedTitle;
            payload.description = descriptionInput.value === "" ? "" : descriptionInput.value;
            payload.status = statusInput.value;
            payload.priority = priorityInput.value;
            payload.assignee = assigneeInput.value.trim() === "" ? null : assigneeInput.value.trim();
        } else {
            const originalTask = modalState.originalTask || null;
            if (trimmedTitle !== (originalTask?.title || "")) {
                payload.title = trimmedTitle;
            }

            const descriptionValue = descriptionInput.value === "" ? "" : descriptionInput.value;
            if (descriptionValue !== (originalTask?.description || "")) {
                payload.description = descriptionValue;
            }

            const statusValue = statusInput.value;
            if (statusValue !== (originalTask?.status || "ToDo")) {
                payload.status = statusValue;
            }

            const priorityValue = priorityInput.value;
            if (priorityValue !== (originalTask?.priority || "Medium")) {
                payload.priority = priorityValue;
            }

            const assigneeValue = assigneeInput.value.trim() === "" ? null : assigneeInput.value.trim();
            if (assigneeValue !== (originalTask?.assignee ?? null)) {
                payload.assignee = assigneeValue;
            }
        }

        if (taskId && Object.keys(payload).length === 0) {
            clearTaskErrors();
            closeTaskModal();
            fetchTasks();
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/tasks${taskId ? `/${taskId}` : ""}`, {
                method: taskId ? "PATCH" : "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                let errorData = {};
                try {
                    errorData = await response.json();
                } catch (error) {
                    console.error(error);
                }

                const { fieldName, message } = extractErrorDetails(errorData);
                if (fieldName && FORM_FIELDS.includes(fieldName)) {
                    showFieldError(fieldName, message);
                } else {
                    showFormError(message);
                }
                return;
            }

            clearTaskErrors();
            closeTaskModal();
            fetchTasks();
        } catch (error) {
            showFormError(error instanceof Error ? error.message : "Unable to save task.");
        }
    }

    function renderTaskCard(task) {
        const priorityClass = task.priority.toLowerCase();
        return `
            <article class="task-card" draggable="true" data-task-id="${task.id}">
                <div class="task-meta">
                    <h3>${task.title}</h3>
                    <span class="priority-pill ${priorityClass}">${task.priority}</span>
                </div>
                <p>${task.description || "No description"}</p>
                <div class="task-meta">
                    <div class="card-actions">
                        <button class="button button-secondary edit-button" type="button">Edit</button>
                    </div>
                </div>
            </article>
        `;
    }

    function renderColumn(status) {
        const statusTasks = tasks
            .filter((task) => task.status === status)
            .sort(compareTasks);

        const taskCards = statusTasks.length
            ? statusTasks.map(renderTaskCard).join("")
            : `<div class="empty-state">Drop tasks here</div>`;

        return `
            <section class="column" data-status="${status}">
                <h2 class="column-title">${STATUS_LABELS[status] || status}</h2>
                ${taskCards}
            </section>
        `;
    }

    function renderBoard() {
        return STATUSES.map(renderColumn).join("");
    }

    function attachBoardInteractions() {
        document.querySelectorAll(".task-card").forEach((card) => {
            card.addEventListener("dragstart", handleDragStart);
            card.addEventListener("dragend", handleDragEnd);
        });

        document.querySelectorAll(".column").forEach((column) => {
            column.addEventListener("dragover", handleDragOver);
            column.addEventListener("drop", handleDrop);
        });

        document.querySelectorAll(".edit-button").forEach((button) => {
            button.addEventListener("click", (event) => {
                event.preventDefault();
                event.stopPropagation();
                const card = button.closest(".task-card");
                const taskId = card?.getAttribute("data-task-id");
                const task = tasks.find((item) => String(item.id) === String(taskId));
                if (task) {
                    openTaskModal(task);
                }
            });
        });
    }

    function attachModalInteractions() {
        const newTaskButton = document.getElementById("new-task-button");
        const modal = document.getElementById("task-modal");
        const closeButton = document.getElementById("task-modal-close");
        const cancelButton = document.getElementById("cancel-task");
        const form = document.getElementById("task-form");

        if (newTaskButton) {
            newTaskButton.addEventListener("click", () => openTaskModal());
        }

        if (closeButton) {
            closeButton.addEventListener("click", closeTaskModal);
        }

        if (cancelButton) {
            cancelButton.addEventListener("click", closeTaskModal);
        }

        if (modal) {
            modal.addEventListener("click", (event) => {
                if (event.target === modal) {
                    closeTaskModal();
                }
            });
        }

        if (form) {
            form.addEventListener("submit", handleTaskSubmit);
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && modalState.isOpen) {
                closeTaskModal();
            }
        });
    }

    function render() {
        const board = document.getElementById("board");
        if (!board) {
            return;
        }

        if (boardState === "loading") {
            board.innerHTML = STATUSES.map(
                () => `
                    <section class="column">
                        <h2 class="column-title">Loading...</h2>
                        <div class="loading-skeleton"></div>
                        <div class="loading-skeleton"></div>
                    </section>
                `
            ).join("");
            return;
        }

        if (boardState === "error") {
            board.innerHTML = `
                <section class="column" style="grid-column: 1 / -1;">
                    <div class="error-card">
                        <p>Unable to load tasks. Please try again later.</p>
                    </div>
                </section>
            `;
            return;
        }

        const boardMarkup = `${boardMessage ? `<div class="board-message error">${boardMessage}</div>` : ""}${renderBoard()}`;
        board.innerHTML = boardMarkup;
        attachBoardInteractions();
    }

    attachModalInteractions();
    fetchTasks();
</script>
</body>
</html>
